<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    
    <title>Books Scraper</title>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Your Books</h1>
            <p>Choose how to spend your free time!</p>
        </div>
    </header>

    <main>
        <section id="books-selection">
            <div id="books-selector" class="books-selector" role="group" aria-label="Vyber knihy">

                <div class="menu-actions">
                    <button type="button" id="refresh-menu" class="actions-button">
                        Aktualizovať knihy
                    </button>

                    <button type="button" id="clear-menu-cache" class="actions-button">
                        Vymazať uložené dáta
                    </button>
                    </div>

                    <p id="menu-loading" hidden>
                        Načítavam knihy...
                    </p>

                <h2 class="h4 mb-3">Vyberte si knihu</h2>

                <div id="books-container" class="row g-3">
                    <!-- listings are generated by JavaScript -->
                </div>
    
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p>Použité knižnice:</p>

            <ul class="libraries">
                <li>
                    <a href="https://getbootstrap.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                        Bootstrap 5
                    </a>
                </li>
                <li>
                    <a href="https://jquery.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                        jQuery
                    </a>
                </li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

     <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
