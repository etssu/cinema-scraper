<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    
    <title>Cinema Scraper</title>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Cinema Menu</h1>
            <p>Choose how to spend your free time!</p>
        </div>
    </header>

    <main>
        <section id="cinema-selection">
            <div id="cinema-selector" class="cinema-selector" role="group" aria-label="Vyber kina">

                <div class="menu-actions">
                    <button type="button" id="refresh-menu" class="actions-button">
                        Aktualizovať kino
                    </button>

                    <button type="button" id="clear-menu-cache" class="actions-button">
                        Vymazať uložené dáta
                    </button>
                    </div>

                    <p id="menu-loading" hidden>
                        Načítavam menu...
                    </p>

                <h2 class="h4 mb-3">Vyberte si kino</h2>

                <div id="cinema-container" class="row g-3">
                    <!-- listings are generated by JavaScript -->
                </div>
    
            </div>
        </section>

        <section id="programme-selection">
            <div id="day-selector" class="day-selector" role="group" aria-label="Výber dňa v týždni">
                <button type="button" id="week-view-toggle" class="day-button">
                    Celý týždeň
                </button>
                <button type="button" class="day-button"
                        data-day="1">Pondelok</button>
                <button type="button" class="day-button"
                        data-day="2">Utorok</button>
                <button type="button" class="day-button"
                        data-day="3">Streda</button>
                <button type="button" class="day-button"
                        data-day="4">Štvrtok</button>
                <button type="button" class="day-button"
                        data-day="5">Piatok</button>
            </div>

            <div id="films-container">
                <!--JavaScript will load films here-->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>Použité knižnice:</p>

            <ul class="libraries">
                <li>
                    <a href="https://getbootstrap.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                        Bootstrap 5
                    </a>
                </li>
                <li>
                    <a href="https://jquery.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                        jQuery
                    </a>
                </li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

     <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
